[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pendulum-lab"
version = "1.0.0"
description = "Control Lab: a professional-grade control-engineering laboratory for the inverted pendulum on a cart."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Control Lab contributors" }]
keywords = ["control", "inverted-pendulum", "lqr", "kalman-filter", "lqg", "swing-up", "robotics"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.10",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
pendulum-lab = "pendulum_lab.cli:main"

[project.urls]
Repository = "https://github.com/julianS-eng/Control-lab-inverted-pendulum"

[tool.hatch.build.targets.wheel]
packages = ["src/pendulum_lab"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "NPY", "PT", "D"]
ignore = [
    "N803",  # argument names such as A, B, K follow control-theory notation
    "N806",  # variable names such as A, B, K follow control-theory notation
    "N802",  # method names such as R or with_Ts follow control-theory notation
    "E741",  # `l` is the standard symbol for the pendulum length
    "RUF001",  # Greek letters and math symbols in figure/table labels are intentional
    "RUF002",
    "RUF003",
    "D105",
    "D107",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]
"scripts/*" = ["D"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["scipy.*", "matplotlib.*", "mpl_toolkits.*", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: long-running integration tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["pendulum_lab"]
branch = true
